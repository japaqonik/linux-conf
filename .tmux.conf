# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------

# New windows and splits inherit the current pane's working directory.
# Note: '\' must be quoted — unquoted, a backslash escapes the following
# space and the binding silently lands on Space instead.
bind  c  new-window      -c "#{pane_current_path}"
bind  -  split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Reload this file. Note that sourcing adds bindings but never removes ones
# that are no longer in the file; those persist until the server restarts.
bind  r  source-file ~/.tmux.conf

# Alt-arrow: move between panes without the prefix.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift-arrow: move between windows without the prefix.
bind -n S-Left  previous-window
bind -n S-Right next-window

# ---------------------------------------------------------------------------
# Terminal capabilities
# ---------------------------------------------------------------------------

set -g default-terminal "xterm-256color"

# Advertise 24-bit colour. 'Tc' is the legacy form; the modern equivalent is
#   set -as terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"

# Let tmux use OSC 52 for clipboard access (requires tmux >= 3.2).
set -as terminal-features ",*:clipboard"

# Let applications send their own escape sequences straight to the outer
# terminal (requires tmux >= 3.3).
set -g allow-passthrough on

# Hand clipboard writes to the outer terminal via OSC 52 rather than keeping
# them in a tmux buffer. This is what makes copying work over a plain SSH
# session, with no X display or helper binary involved.
set -g set-clipboard external

set -g mouse on

# ---------------------------------------------------------------------------
# Status line
# ---------------------------------------------------------------------------

# status-bg/status-fg are undocumented in current tmux but still honoured, and
# they take precedence over status-style. To move to status-style, replace
# these two lines rather than adding to them:
#   set -g status-style bg=colour238,fg=white
set -g status-bg colour238
set -g status-fg white

# Highlight the active window. The split -bg/-fg/-attr options were removed in
# tmux 2.9; everything goes through a single *-style option now.
set -g window-status-current-style bg=colour240,fg=white
#set -g window-status-current-style bg=colour240,fg=white,bold

# Right side: filesystem usage, pane title, clock and date.
#
# @scripts_dir keeps the one host-specific path in this file; point it wherever
# the repo is checked out. Options are read by the script at render time, so
# their order relative to status-right does not matter.
#
# @disk_paths selects which filesystems appear, as "label=directory" pairs.
# It reports the filesystem *containing* each directory, so two paths on one
# filesystem collapse into a single segment. A leading ~ is expanded; labels
# must not contain spaces.
#
# @disk_next_bg must match the background of the segment drawn after the
# widget, so the half-block seam blends correctly. The bar's own background is
# detected from status-bg/status-style automatically; override it with
# @disk_bar_bg only if that guess is ever wrong.
#
# Glyphs: U+258C half-block marks a change of background colour between
# segments, U+2502 divides fields sharing one background.
set -g @scripts_dir "~/bin"
set -g @disk_paths "home=~"
set -g @disk_warn 80
set -g @disk_crit 90
set -g @disk_next_bg 240

set -g status-interval 15
set -g status-right-length 100
set -g status-right "#(#{@scripts_dir}/tmux-disk)#[fg=colour252,bg=colour240] #{=21:pane_title} #[fg=colour240,bg=colour250]▌#[fg=colour235,bg=colour250,bold] %H:%M #[fg=colour235,bg=colour250]│ %d-%b-%y "

# Left side: session name.
set -g status-left-length 20
set -g status-left "#[fg=colour235,bg=colour250,bold] #S #[fg=colour250,bg=colour238]▌"

